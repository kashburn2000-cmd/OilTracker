name: Refresh SPR data

on:
  schedule:
    # DOE updates SPR inventory daily; EIA's weekly report lands Wednesdays
    # ~10:30 ET. 17:00 UTC clears both, in every part of the year.
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-spr
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest SPR level
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        # The log line says which source won — check it on the first run to see
        # whether the DOE scrape is working or it's quietly falling back to EIA.
        run: node scripts/fetch-spr.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/spr.json; then
            echo "No change in SPR data."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spr.json
          git commit -m "data: SPR level for $(node -p "require('./data/spr.json').period")"
          git push
